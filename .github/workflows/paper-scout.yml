name: Weekly paper scout

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_count: ${{ steps.count.outputs.candidate_count }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Discover recent arXiv candidates
        run: python3 automation/discover_papers.py

      - name: Read candidate count
        id: count
        run: echo "candidate_count=$(python3 -c 'import json; print(json.load(open("automation/candidates.json"))["candidateCount"])')" >> "$GITHUB_OUTPUT"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper-candidates
          path: automation/candidates.json
          if-no-files-found: error
          retention-days: 14

  curate:
    needs: discover
    if: needs.discover.outputs.candidate_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      reviewed_json: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: paper-candidates
          path: automation

      - name: Curate with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/curate-papers.md
          output-schema-file: .github/codex/schemas/paper-review.schema.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral", "--ignore-user-config"]'

  propose:
    needs: [discover, curate]
    if: needs.discover.outputs.candidate_count != '0' && needs.curate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: paper-candidates
          path: automation

      - name: Persist structured Codex review
        env:
          CODEX_REVIEW_JSON: ${{ needs.curate.outputs.reviewed_json }}
        run: python3 automation/write_review_output.py --output automation/reviewed-papers.json

      - name: Merge high-confidence records
        run: >-
          python3 automation/merge_papers.py
          --candidates automation/candidates.json
          --review automation/reviewed-papers.json
          --papers intelligent-audio-production/data/papers.json
          --output intelligent-audio-production/data/papers.json

      - name: Validate website data and tests
        run: |
          python3 automation/validate_data.py
          python3 -m unittest discover -s automation/tests -v
          node --check intelligent-audio-production/app.js

      - name: Detect publishable changes
        id: changes
        run: |
          if git diff --quiet -- intelligent-audio-production/data/papers.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ vars.PAPER_SCOUT_AUTO_MERGE }}
        run: |
          branch="automation/paper-scout-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add intelligent-audio-production/data/papers.json
          git commit -m "Update recent intelligent audio papers"
          git push origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" --title "Update recent intelligent audio papers" --body "Weekly Codex paper-scout update. Metadata comes from the arXiv API and passed deterministic validation before this PR was created.")
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge --auto --squash "$pr_url"
          fi
