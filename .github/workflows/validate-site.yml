name: Validate site data

on:
  pull_request:
    paths:
      - "intelligent-audio-production/**"
      - "automation/**"
      - ".github/codex/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate data and automation
        run: |
          python3 automation/validate_data.py
          python3 -m unittest discover -s automation/tests -v
          node --check intelligent-audio-production/app.js
          git diff --check
